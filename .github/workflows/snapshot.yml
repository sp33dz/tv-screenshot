name: On-Demand Snapshot
run-name: "Snapshot ${{ github.event.inputs.symbol }} [${{ github.event.inputs.timeframes }}]"
on:
  workflow_dispatch:
    inputs:
      symbol:
        description: "Stock symbol e.g. ASPN, AAPL, BTCUSDT"
        required: true
        default: "AAPL"
        type: string
      exchange:
        description: "Exchange prefix: NYSE, NASDAQ, CRYPTO, SET — blank=auto"
        required: false
        default: ""
        type: string
      timeframes:
        description: "Timeframes comma-separated: 1,5,30,60,240,D,W"
        required: false
        default: "60,240,D,W"
        type: string
      wait_sec:
        description: "Seconds to wait for chart render (8-40)"
        required: false
        default: "18"
        type: string
      theme:
        description: "Chart theme"
        required: false
        default: "dark"
        type: choice
        options:
          - "dark"
          - "light"

concurrency:
  group: "snapshot-${{ github.event.inputs.symbol }}"
  cancel-in-progress: true

jobs:
  snapshot:
    name: "Snapshot ${{ github.event.inputs.symbol }} [${{ github.event.inputs.timeframes }}]"
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      PYTHONUNBUFFERED: "1"
      PYTHONDONTWRITEBYTECODE: "1"
      TV_SESSION_JSON: ${{ secrets.TV_SESSION_JSON }}
      INPUT_SYMBOL: ${{ github.event.inputs.symbol }}
      INPUT_EXCHANGE: ${{ github.event.inputs.exchange }}
      INPUT_TIMEFRAMES: ${{ github.event.inputs.timeframes }}
      INPUT_WAIT_SEC: ${{ github.event.inputs.wait_sec }}
      INPUT_THEME: ${{ github.event.inputs.theme }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install --quiet playwright Pillow

      - name: Install Chromium
        run: playwright install chromium --with-deps

      - name: Run snapshot script
        run: python snapshot_run.py

      - name: Upload artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: "snapshots-${{ github.event.inputs.symbol }}-${{ github.run_id }}"
          path: snapshots/
          retention-days: 1
          if-no-files-found: warn

      - name: Write job summary
        if: always()
        run: |
          echo "### Snapshot Result" >> $GITHUB_STEP_SUMMARY
          echo "| | |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| Symbol | \`${{ github.event.inputs.symbol }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Exchange | \`${{ github.event.inputs.exchange || 'auto' }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Timeframes | \`${{ github.event.inputs.timeframes }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Run ID | \`${{ github.run_id }}\` |" >> $GITHUB_STEP_SUMMARY
