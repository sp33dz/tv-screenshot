# ╔══════════════════════════════════════════════════════════════╗
# ║  .github/workflows/snapshot.yml                             ║
# ║  On-Demand Snapshot — triggered from screenshot.html         ║
# ║                                                              ║
# ║  รับ input: symbol, exchange, timeframes (comma-separated)   ║
# ║  ไม่ save ไม่ commit — upload artifact เท่านั้น              ║
# ║  เร็วที่สุด: ติดตั้ง deps แบบ minimal + no Drive/Telegram   ║
# ╚══════════════════════════════════════════════════════════════╝

name: On-Demand Snapshot

on:
  workflow_dispatch:
    inputs:
      symbol:
        description: "Stock symbol (e.g. ASPN, BTCUSDT, AAPL)"
        required: true
        default: "AAPL"
        type: string
      exchange:
        description: "Exchange prefix (e.g. NYSE, NASDAQ, CRYPTO, SET) — leave blank for auto"
        required: false
        default: ""
        type: string
      timeframes:
        description: "Timeframes comma-separated: 1,5,30,60,240,D,W"
        required: false
        default: "60,240,D,W"
        type: string
      wait_sec:
        description: "Seconds to wait for chart to fully render (10–30)"
        required: false
        default: "18"
        type: string
      theme:
        description: "Chart theme"
        required: false
        default: "dark"
        type: choice
        options:
          - "dark"
          - "light"

concurrency:
  group: snapshot-${{ github.ref }}-${{ github.event.inputs.symbol }}
  cancel-in-progress: true   # ยกเลิก run เก่าถ้า trigger ซ้ำสำหรับ symbol เดิม

jobs:
  snapshot:
    name: "📸 ${{ github.event.inputs.symbol }} [${{ github.event.inputs.timeframes }}]"
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      PYTHONUNBUFFERED: "1"
      PYTHONDONTWRITEBYTECODE: "1"

    steps:
      # ── 1. Checkout (minimal — แค่ได้ cookies จาก secret ไม่ต้องโค้ดเยอะ) ──
      - name: Checkout
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            .github
          fetch-depth: 1

      # ── 2. Python — ใช้ cache เพื่อความเร็ว ──
      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      # ── 3. Install minimal deps (playwright only — ไม่ต้องการ rclone/telegram) ──
      - name: Install Python deps
        run: |
          pip install --quiet playwright Pillow

      # ── 4. Install Chromium (cached across runs via GitHub Actions cache) ──
      - name: Install Chromium
        run: playwright install chromium --with-deps

      # ── 5. Run snapshot script ──
      - name: Take Screenshots
        env:
          TV_SESSION_JSON: ${{ secrets.TV_SESSION_JSON }}
          INPUT_SYMBOL:    ${{ github.event.inputs.symbol }}
          INPUT_EXCHANGE:  ${{ github.event.inputs.exchange }}
          INPUT_TIMEFRAMES: ${{ github.event.inputs.timeframes }}
          INPUT_WAIT_SEC:  ${{ github.event.inputs.wait_sec }}
          INPUT_THEME:     ${{ github.event.inputs.theme }}
        run: |
          python - << 'PYEOF'
import os, json, sys, time
from pathlib import Path
from datetime import datetime

# ── Read inputs ──────────────────────────────────────────────
symbol    = os.environ.get("INPUT_SYMBOL", "AAPL").strip().upper()
exchange  = os.environ.get("INPUT_EXCHANGE", "").strip().upper()
tfs_raw   = os.environ.get("INPUT_TIMEFRAMES", "60,240,D,W").strip()
wait_sec  = int(os.environ.get("INPUT_WAIT_SEC", "18"))
theme     = os.environ.get("INPUT_THEME", "dark")
tv_session= os.environ.get("TV_SESSION_JSON", "")

timeframes = [t.strip() for t in tfs_raw.split(",") if t.strip()]
print(f"Symbol    : {symbol}")
print(f"Exchange  : {exchange or 'auto'}")
print(f"Timeframes: {timeframes}")
print(f"Wait sec  : {wait_sec}")
print(f"Theme     : {theme}")
print(f"TV session: {'present' if tv_session else 'MISSING'}")

# ── TF → TradingView interval mapping ────────────────────────
TF_MAP = {
    "1":   "1",   "1m": "1",
    "5":   "5",   "5m": "5",
    "15":  "15",  "15m":"15",
    "30":  "30",  "30m":"30",
    "60":  "60",  "1h": "60",  "1H": "60",
    "240": "240", "4h": "240", "4H": "240",
    "D":   "D",   "d":  "D",   "1D": "D",
    "W":   "W",   "w":  "W",   "1W": "W",
}

TF_LABEL = {
    "1":"1M","5":"5M","15":"15M","30":"30M",
    "60":"1H","240":"4H","D":"D","W":"W",
}

def build_tv_url(sym, exch, tf_key, theme="dark"):
    interval = TF_MAP.get(tf_key, tf_key)
    prefix = f"{exch}:{sym}" if exch else sym
    # Clean full-screen chart URL — no sidebar clutter, dark theme
    return (
        f"https://www.tradingview.com/chart/"
        f"?symbol={prefix}"
        f"&interval={interval}"
        f"&theme={theme}"
        f"&style=1"
        f"&hide_top_toolbar=0"
        f"&hide_side_toolbar=0"
        f"&allow_symbol_change=0"
        f"&save_image=false"
        f"&studies=[]"
    )

# ── Output folder ─────────────────────────────────────────────
out_dir = Path("snapshots")
out_dir.mkdir(exist_ok=True)

# ── Inject TV session ─────────────────────────────────────────
def inject_session(context, session_json):
    if not session_json or not session_json.strip():
        print("  [session] TV_SESSION_JSON not set — running without login")
        return False
    try:
        data = json.loads(session_json)
        cookies = data.get("cookies", [])
        if cookies:
            context.add_cookies(cookies)
            print(f"  [session] Injected {len(cookies)} cookies")
        origins = data.get("origins", [])
        if origins:
            origins_json = json.dumps(origins, ensure_ascii=False)
            context.add_init_script(f"""
(function(){{
  var origins={origins_json};
  origins.forEach(function(o){{
    if(window.location.origin!==o.origin)return;
    (o.localStorage||[]).forEach(function(i){{
      try{{localStorage.setItem(i.name,i.value);}}catch(e){{}}
    }});
  }});
}})();""")
            print(f"  [session] Injected localStorage for {len(origins)} origin(s)")
        return True
    except Exception as e:
        print(f"  [session] Warning: {e}")
        return False

# ── Popup dismiss selectors ────────────────────────────────────
POPUP_SELECTORS = [
    'button[data-name="close"]',
    'button[aria-label="Close"]',
    'button[aria-label="close"]',
    'div[class*="closeButton"]',
    'button[class*="close-button"]',
    'div[role="dialog"] button[class*="close"]',
    'button:has-text("×")',
    'button:has-text("✕")',
]

def dismiss_popups(page, label=""):
    dismissed = 0
    for sel in POPUP_SELECTORS:
        try:
            btn = page.query_selector(sel)
            if btn and btn.is_visible():
                btn.click(timeout=1000)
                dismissed += 1
                page.wait_for_timeout(300)
        except Exception:
            pass
    if dismissed:
        print(f"  [{label}] Dismissed {dismissed} popup(s)")
    return dismissed

def wait_for_chart(page, symbol, timeout_sec=25):
    """Wait for chart-container to appear and spinner to disappear."""
    try:
        page.wait_for_selector(
            'div[class*="chart-container"]',
            timeout=timeout_sec * 1000
        )
    except Exception:
        print(f"  [{symbol}] chart-container not found — proceeding anyway")
    # Wait for spinner to go away
    for _ in range(15):
        try:
            spinner = page.query_selector('div[class*="spinner"]')
            if not spinner or not spinner.is_visible():
                break
        except Exception:
            break
        page.wait_for_timeout(500)

# ── Main Playwright run ────────────────────────────────────────
from playwright.sync_api import sync_playwright

results = []  # list of {tf, label, path, success, error}
screenshot_paths = []

with sync_playwright() as pw:
    launch_args = [
        "--window-size=1920,1080",
        "--disable-notifications",
        "--disable-popup-blocking",
        "--no-first-run",
        "--no-default-browser-check",
        "--disable-default-apps",
        "--disable-dev-shm-usage",
        "--no-sandbox",
        "--disable-setuid-sandbox",
    ]

    print("\n=== Opening Chromium ===")
    context = pw.chromium.launch_persistent_context(
        user_data_dir="/tmp/.pw_snap_profile",
        headless=True,
        args=launch_args,
        viewport={"width": 1920, "height": 1080},
        ignore_default_args=["--enable-automation"],
    )

    # Inject session once for the context
    inject_session(context, tv_session)

    page = context.new_page()

    for tf_key in timeframes:
        tf_label = TF_LABEL.get(tf_key, tf_key)
        url = build_tv_url(symbol, exchange, tf_key, theme)
        out_path = out_dir / f"{symbol}_{tf_label}.png"

        print(f"\n--- {symbol} [{tf_label}] ---")
        print(f"  URL: {url}")

        try:
            page.goto(url, timeout=30_000, wait_until="domcontentloaded")

            # Early popup dismiss
            page.wait_for_timeout(1500)
            dismiss_popups(page, tf_label)

            # Wait for chart
            wait_for_chart(page, symbol, timeout_sec=wait_sec)

            # Extra wait for indicators to settle
            page.wait_for_timeout(max(0, (wait_sec - 10)) * 1000)

            # Final popup dismiss before screenshot
            dismiss_popups(page, tf_label)

            # Screenshot
            img_bytes = page.screenshot(full_page=False)
            out_path.write_bytes(img_bytes)

            size_kb = len(img_bytes) // 1024
            print(f"  Saved: {out_path} ({size_kb} KB)")
            results.append({"tf": tf_key, "label": tf_label, "path": str(out_path), "success": True})
            screenshot_paths.append(str(out_path))

        except Exception as e:
            print(f"  ERROR [{tf_label}]: {e}")
            results.append({"tf": tf_key, "label": tf_label, "path": "", "success": False, "error": str(e)})

    context.close()
    print("\n=== Browser closed ===")

# ── Write manifest JSON (used by HTML to know which files exist) ──
manifest = {
    "symbol":     symbol,
    "exchange":   exchange,
    "timeframes": timeframes,
    "theme":      theme,
    "timestamp":  datetime.utcnow().isoformat() + "Z",
    "results":    results,
}
manifest_path = out_dir / "manifest.json"
manifest_path.write_text(json.dumps(manifest, indent=2, ensure_ascii=False), encoding="utf-8")
print(f"\nManifest: {manifest_path}")

# ── Summary ──
ok  = sum(1 for r in results if r["success"])
fail= len(results) - ok
print(f"\n{'='*50}")
print(f"DONE: {ok}/{len(results)} OK  ({fail} failed)")
for r in results:
    status = "OK " if r["success"] else "ERR"
    info = r.get("path", r.get("error", ""))
    print(f"  {status}  {symbol}_{r['label']}  {info}")

sys.exit(0 if ok == len(results) else 1)
PYEOF

      # ── 6. Upload screenshots + manifest as artifact ──
      - name: Upload Snapshots Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: snapshots-${{ github.event.inputs.symbol }}-${{ github.run_id }}
          path: snapshots/
          retention-days: 1
          if-no-files-found: warn

      # ── 7. Print run summary ──
      - name: Summary
        if: always()
        run: |
          echo "### 📸 Snapshot Result" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Field | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| Symbol | \`${{ github.event.inputs.symbol }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Exchange | \`${{ github.event.inputs.exchange || 'auto' }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Timeframes | \`${{ github.event.inputs.timeframes }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Run ID | \`${{ github.run_id }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ -f snapshots/manifest.json ]; then
            echo "**Manifest:**" >> $GITHUB_STEP_SUMMARY
            echo '```json' >> $GITHUB_STEP_SUMMARY
            cat snapshots/manifest.json >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          fi
