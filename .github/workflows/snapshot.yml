name: On-Demand Snapshot

on:
  workflow_dispatch:
    inputs:
      symbol:
        description: "Stock symbol (e.g. ASPN, AAPL, BTCUSDT)"
        required: true
        default: "AAPL"
        type: string
      exchange:
        description: "Exchange prefix (NYSE, NASDAQ, CRYPTO, SET) leave blank for auto"
        required: false
        default: ""
        type: string
      timeframes:
        description: "Timeframes comma-separated: 1,5,30,60,240,D,W"
        required: false
        default: "60,240,D,W"
        type: string
      wait_sec:
        description: "Seconds to wait for chart to render (8-40)"
        required: false
        default: "18"
        type: string
      theme:
        description: "Chart theme"
        required: false
        default: "dark"
        type: choice
        options:
          - "dark"
          - "light"
      run_token:
        description: "Unique run token for polling (auto-generated by HTML)"
        required: false
        default: ""
        type: string

concurrency:
  group: "snapshot-${{ github.event.inputs.symbol }}"
  cancel-in-progress: true

jobs:
  snapshot:
    name: "Snapshot ${{ github.event.inputs.symbol }} [${{ github.event.inputs.timeframes }}]"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write

    env:
      PYTHONUNBUFFERED: "1"
      PYTHONDONTWRITEBYTECODE: "1"
      TV_SESSION_JSON: ${{ secrets.TV_SESSION_JSON }}
      INPUT_SYMBOL: ${{ github.event.inputs.symbol }}
      INPUT_EXCHANGE: ${{ github.event.inputs.exchange }}
      INPUT_TIMEFRAMES: ${{ github.event.inputs.timeframes }}
      INPUT_WAIT_SEC: ${{ github.event.inputs.wait_sec }}
      INPUT_THEME: ${{ github.event.inputs.theme }}
      INPUT_RUN_TOKEN: ${{ github.event.inputs.run_token }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install --quiet playwright Pillow

      - name: Install Chromium
        run: playwright install chromium --with-deps

      - name: Run snapshot script
        run: python snapshot_run.py

      - name: Upload artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: "snapshots-${{ github.event.inputs.symbol }}-${{ github.run_id }}"
          path: snapshots/
          retention-days: 1
          if-no-files-found: warn

      - name: Write STATUS JSON for GitHub Pages polling
        if: always()
        run: python write_status.py
        env:
          PAGES_BASE_URL: "https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}"

      - name: Deploy snapshots and STATUS to gh-pages
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          WORK_DIR="$(pwd)"
          SYMBOL="${{ github.event.inputs.symbol }}"

          git fetch origin gh-pages 2>/dev/null || true

          TMPDIR_PAGES="$(mktemp -d)"
          if git worktree add "$TMPDIR_PAGES" gh-pages 2>/dev/null; then
            echo "Checked out existing gh-pages branch"
          else
            git worktree add --detach "$TMPDIR_PAGES"
            git -C "$TMPDIR_PAGES" checkout --orphan gh-pages
            git -C "$TMPDIR_PAGES" rm -rf . 2>/dev/null || true
            echo "Created new gh-pages orphan branch"
          fi

          mkdir -p "$TMPDIR_PAGES/snapshots"

          if ls "$WORK_DIR/snapshots/"*.png 2>/dev/null; then
            cp "$WORK_DIR/snapshots/"*.png "$TMPDIR_PAGES/snapshots/"
          fi

          if [ -f "$WORK_DIR/snapshots/STATUS_${SYMBOL}.json" ]; then
            cp "$WORK_DIR/snapshots/STATUS_${SYMBOL}.json" "$TMPDIR_PAGES/snapshots/"
          fi

          cd "$TMPDIR_PAGES"
          git add snapshots/
          if git diff --cached --quiet; then
            echo "No changes to commit to gh-pages"
          else
            git commit -m "snapshot: ${SYMBOL} @ $(date -u +'%Y-%m-%dT%H:%M:%SZ') [run=${{ github.run_id }}]"
            git push origin HEAD:gh-pages --force
          fi

          cd "$WORK_DIR"
          git worktree remove "$TMPDIR_PAGES" --force 2>/dev/null || true

      - name: Write job summary
        if: always()
        run: |
          echo "### Snapshot Result" >> $GITHUB_STEP_SUMMARY
          echo "| | |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| Symbol | \`${{ github.event.inputs.symbol }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Exchange | \`${{ github.event.inputs.exchange || 'auto' }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Timeframes | \`${{ github.event.inputs.timeframes }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Run Token | \`${{ github.event.inputs.run_token }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Run ID | \`${{ github.run_id }}\` |" >> $GITHUB_STEP_SUMMARY
          if [ -f snapshots/manifest.json ]; then
            echo "" >> $GITHUB_STEP_SUMMARY
            echo '```json' >> $GITHUB_STEP_SUMMARY
            cat snapshots/manifest.json >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          fi
